<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicode Characters</title>
    <style>
        body {
            user-select: none;
        }
        .box {
            position: relative;
            display: inline-block;
            width: 80px;
            height: 100px;
            border: 1px solid #ccc;
            margin: 4px;
            text-align: center;
            font-size: 24px;
            cursor: pointer;
            background-color: #f0f0f0;
            user-select: none;
            vertical-align: top;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease;
        }
        .char {
            flex: 1;
            display: flex;
            align-items: center;
            font-size: 28px;
        }
        .name {
            font-size: 9px;
            text-align: center;
            word-wrap: break-word;
            max-width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            color: #666;
        }
        .info {
            position: absolute;
            top: 4px;
            left: 4px;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            background: #fff;
            border: 1px solid #ccc;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .heart {
            position: absolute;
            top: 4px;
            right: 4px;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            background: #fff;
            border: 1px solid #ccc;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #container {
            display: flex;
            flex-wrap: wrap;
        }
        #controls {
            text-align: center;
            margin: 10px;
        }
        #top {
            text-align: center;
            margin: 10px;
        }
        button {
            margin: 0 10px;
            padding: 5px 10px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="top">
        <a href="/" style="margin-right:12px;">Home</a>
        <a href="/char-code">Character to Code</a>
        <div style="margin-top:12px; display:flex; align-items:center; justify-content:center; gap:8px;">
            <button id="searchClear" style="padding:5px 8px;">✕</button>
            <input type="text" id="search" placeholder="Search by name" style="min-width:220px;">
            <select id="filter">
                <option value="all">ALL</option>
                <option value="favs">FAVOURITES</option>
            </select>
        </div>
    </div>
    <div id="loading" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); color: white; padding: 20px; border-radius: 5px; z-index: 1000;">Searching...</div>    <div id="controls">
        <button id="prev">Prev</button>
        <span id="pageInfo"></span>
        <input type="number" id="gotoPage" min="1" placeholder="Page">
        <button id="goBtn">Go</button>
        <button id="next">Next</button>
    </div>
    <div id="container"></div>
    <div id="charInfoPage" class="hidden" style="max-width: 720px; margin: 10px auto; padding: 12px; border: 1px solid #ccc; background: #fff; font-family: sans-serif;">
        <a href="/" id="charInfoBack" style="font-weight: bold; color: #007acc; text-decoration: none;">← Back to character grid</a>
        <div id="charInfoContent" style="margin-top: 12px;"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
